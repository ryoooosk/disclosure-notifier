name: disclosure-notifier

on:
  schedule:
    # 毎日 JST 17:30（UTC 08:30）に実行
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: "基準時刻。TDnet の対象日と EDINET の取得範囲がこの時刻で決まる。YYYY-MM-DD ならその日の 17:30 JST、ISO 8601 の日時も可。空なら現在時刻"
        required: false
        type: string

permissions:
  contents: read

jobs:
  disclosure-notifier:
    # dispatcher（Cloudflare Workers）から起動する場合は、同じ日に 2 回走らないよう schedule の回を飛ばす
    if: github.event_name != 'schedule' || vars.DISPATCHER_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: verify config
        id: verify
        env:
          WATCHLIST_JSONC: ${{ secrets.WATCHLIST_JSONC }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          missing=()
          for name in WATCHLIST_JSONC RESEND_API_KEY EMAIL_FROM EMAIL_TO EDINET_API_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::未設定の Secret / Variable: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm ci
      - name: write watchlist
        env:
          WATCHLIST_JSONC: ${{ secrets.WATCHLIST_JSONC }}
        run: printf '%s' "$WATCHLIST_JSONC" > src/data-source/watchlist/watchlist.jsonc

      - name: resolve scheduled_at
        id: scheduled_at
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            # schedule は数時間遅れて起動するので、cron の予定時刻（直前の UTC 08:30）を基準時刻にする。
            # 上の cron と揃えておく。
            # re-run するとその時点から計算し直すので、後日やり直すときは scheduled_at を指定して手動実行する
            scheduled=$(date -u -d 'today 08:30' +%s)
            if [ "$scheduled" -gt "$(date -u +%s)" ]; then
              scheduled=$((scheduled - 24 * 60 * 60))
            fi
            scheduled_at=$(date -u -d "@$scheduled" +%Y-%m-%dT%H:%M:%SZ)
          else
            # 空なら現在時刻、不正な値ならアプリ側で落ちる
            scheduled_at=$INPUT_SCHEDULED_AT
          fi
          echo "value=$scheduled_at" >> "$GITHUB_OUTPUT"

      - name: execute Application
        # 入力は run に直接埋め込まず、env を経由して渡す（スクリプトインジェクション対策）
        run: node src/index.ts --scheduled-at "$SCHEDULED_AT"
        env:
          SCHEDULED_AT: ${{ steps.scheduled_at.outputs.value }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}

      - name: failure notice
        # 設定が揃っていない（verify config が落ちた）ときは送りようがないので送らない
        if: failure() && steps.verify.outcome == 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg from "$EMAIL_FROM" \
            --arg to "$EMAIL_TO" \
            --arg url "$RUN_URL" \
            '{
              from: $from,
              to: [$to],
              subject: "disclosure-notifier が失敗しました",
              text: "disclosure-notifier の実行が失敗しました。開示があっても通知は届いていません。\n\n実行ログ: \($url)"
            }' \
            | curl -sS --fail-with-body \
                -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d @-
